<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shorts Generator</title>
<style>
  body { font-family: Arial, sans-serif; background: #0f0f0f; color: #f1f1f1; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 22px; }
  input[type="text"] { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #333; background: #1c1c1c; color: #fff; box-sizing: border-box; }
  input[type="file"] { margin: 8px 0; color: #ccc; }
  button { padding: 10px 18px; background: #e11d48; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; }
  button:disabled { background: #555; cursor: not-allowed; }
  #status { margin-top: 14px; font-size: 14px; color: #aaa; }
  .error { color: #ff6b6b; }
  .clip { display: flex; align-items: center; gap: 12px; background: #1c1c1c; padding: 10px; border-radius: 8px; margin-top: 10px; }
  .clip video { width: 110px; border-radius: 6px; }
  .clip a { color: #4dd0e1; text-decoration: none; }
  small { color: #888; }
</style>
</head>
<body>
  <h1>🎬 YouTube → Shorts Generator</h1>
  <p><small>वीडियो लिंक पेस्ट करें (अधिकतम {{ '15' }} मिनट)। ज़रूरत पड़ने पर cookies.txt भी अपलोड कर सकते हैं।</small></p>

  <form id="genForm">
    <input type="text" id="url" placeholder="YouTube या डायरेक्ट MP4 लिंक पेस्ट करें" required />
    <input type="file" id="cookies" accept=".txt" />
    <br />
    <button type="submit" id="submitBtn">Generate Shorts</button>
  </form>

  <div id="status"></div>
  <div id="clips"></div>

<script>
const form = document.getElementById("genForm");
const statusEl = document.getElementById("status");
const clipsEl = document.getElementById("clips");
const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const url = document.getElementById("url").value.trim();
  const cookiesFile = document.getElementById("cookies").files[0];

  clipsEl.innerHTML = "";
  statusEl.textContent = "प्रोसेस हो रहा है... इसमें 1-3 मिनट लग सकते हैं, कृपया पेज बंद न करें।";
  statusEl.className = "";
  submitBtn.disabled = true;

  const formData = new FormData();
  formData.append("url", url);
  if (cookiesFile) formData.append("cookies", cookiesFile);

  try {
    const res = await fetch("/generate", { method: "POST", body: formData });
    const data = await res.json();

    if (!res.ok) {
      statusEl.textContent = data.error || "कुछ गलत हो गया।";
      statusEl.className = "error";
      return;
    }

    statusEl.textContent = `${data.clips.length} क्लिप्स तैयार हैं:`;
    data.clips.forEach((clip, i) => {
      const div = document.createElement("div");
      div.className = "clip";
      div.innerHTML = `
        <video src="${clip.url}" muted></video>
        <div>
          <div>Clip ${i + 1} (${clip.start}s - ${clip.end}s)</div>
          <a href="${clip.url}" download>⬇️ Download</a>
        </div>
      `;
      clipsEl.appendChild(div);
    });
  } catch (err) {
    statusEl.textContent = "सर्वर से जवाब नहीं मिला।";
    statusEl.className = "error";
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
